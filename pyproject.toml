[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-world-model"
version = "0.1.0"
description = "Tiny world model experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "einops>=0.7",
    "tqdm>=4.66",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Torch is intentionally NOT a hard dep: Colab ships its own CUDA build.
# Install locally with:  pip install -e ".[local]"
local = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a developer's global ruff config cannot change CI results.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebooks legitimately import inside cells, in cell order rather than sorted.
"notebooks/*.ipynb" = ["I001", "E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
