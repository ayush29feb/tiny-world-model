[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-world-model"
version = "0.1.0"
description = "Tiny pixel games whose frames are binary bitmaps, for world-model experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The game engine is pure numpy. pygame is only needed to play it in a window.
play = ["pygame-ce>=2.5"]
# For games.dino.dataset and the model in tiny_world_model/. Not a hard dependency: Colab ships its own CUDA
# build of torch, and installing a second one breaks the runtime.
train = ["torch>=2.2", "pillow>=9"]
# For the live training display. Colab already has both.
notebook = ["matplotlib>=3.7", "ipython>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["games*", "tiny_world_model*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a developer's global ruff config cannot change CI results.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
