name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only torch keeps the install small and still runs the model tests. Installing
      # it first means the `train` extra finds torch already there and adds only Pillow.
      # pygame is not needed: the engine is pure numpy.
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,notebook,dev]"
      - run: ruff check .
      # Fail if any test is skipped for a missing package, instead of passing quietly.
      # pipefail keeps pytest's own failure visible through the pipe to tee.
      - run: |
          set -o pipefail
          pytest -q -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then echo "tests were skipped"; exit 1; fi
